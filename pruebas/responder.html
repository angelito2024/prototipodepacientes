<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-store">
<title>Cuestionario</title>
<style>
  :root{
    --tinta:#1f2430; --suave:#5b6577; --linea:#e2e6ee; --fondo:#f4f6fa;
    --papel:#fff; --acento:#2f6f4f; --acento2:#e8f2ec; --alerta:#a3381f;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--fondo);color:var(--tinta);
       font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       -webkit-text-size-adjust:100%}
  .caja{max-width:720px;margin:0 auto;padding:0 16px 120px}

  header{background:var(--papel);border-bottom:1px solid var(--linea);
         position:sticky;top:0;z-index:5}
  .cabecera{max-width:720px;margin:0 auto;padding:12px 16px}
  .titulo{font-size:17px;font-weight:700;margin:0}
  .sub{font-size:13px;color:var(--suave);margin:2px 0 0}
  .barra{height:6px;background:var(--linea);border-radius:99px;margin-top:10px;overflow:hidden}
  .barra>i{display:block;height:100%;background:var(--acento);width:0;transition:width .25s}
  .cuenta{font-size:12px;color:var(--suave);margin-top:6px;display:flex;
          justify-content:space-between;gap:10px}

  /* La firma del centro. Va chica y arriba: el enlace llega por WhatsApp
     y lo primero que hace quien lo abre es buscar de quién es. */
  .marca{display:flex;align-items:center;gap:10px}
  .marca img{width:34px;height:34px;object-fit:contain;flex:none}
  .marca b{font-size:13.5px;font-weight:700;line-height:1.2}
  .marca small{display:block;font-size:11.5px;color:var(--suave);font-weight:400}

  /* La portada: de quién es el enlace, antes de cualquier pregunta. */
  .portada{text-align:center;padding:26px 20px 10px}
  .portada .sello{width:92px;height:92px;object-fit:contain;margin:0 auto 14px;display:block}
  .portada h1{font-size:19px;margin:0 0 4px}
  .portada .de{font-size:14px;color:var(--suave);margin:0 0 18px}
  .paraquien{background:var(--acento2);border:1px solid #c6ded2;border-radius:12px;
             padding:14px 16px;margin:0 0 16px;text-align:left}
  .paraquien .et{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;
                 color:#3f6b57;font-weight:700}
  .paraquien .quien{font-size:19px;font-weight:700;margin-top:3px}
  .paraquien .que{font-size:13.5px;color:#3f6b57;margin-top:5px}
  .frase{font-size:14.5px;font-style:italic;color:#4a5365;margin:18px 0 0;
         padding-top:16px;border-top:1px solid var(--linea);text-wrap:balance}
  .campo{text-align:left;margin:4px 0 0}
  .campo label{display:block;font-size:13.5px;font-weight:600;margin-bottom:6px}
  .campo input{width:100%;font:inherit;font-size:19px;letter-spacing:.08em;
               text-align:center;padding:13px 12px;border:1.5px solid var(--linea);
               border-radius:10px;background:#fbfcfe;color:var(--tinta)}
  .campo input:focus-visible{outline:3px solid #b9d9c8;outline-offset:1px;
                             border-color:var(--acento)}
  .campo .pista{font-size:12.5px;color:var(--suave);margin-top:7px}
  .noyo{background:none;border:0;color:var(--suave);font-size:13px;
        text-decoration:underline;padding:12px 4px;cursor:pointer;font-weight:400}

  .tarjeta{background:var(--papel);border:1px solid var(--linea);border-radius:12px;
           padding:18px;margin:16px 0}
  .tarjeta h2{font-size:16px;margin:0 0 8px}
  .tarjeta p{margin:8px 0;font-size:14.5px;color:#39404f}

  .item{background:var(--papel);border:1px solid var(--linea);border-radius:12px;
        padding:14px 16px;margin:10px 0}
  .item.falta{border-color:#e7b7a8;background:#fdf7f5}
  .item .n{font-size:12px;color:var(--suave);font-weight:700;letter-spacing:.04em}
  .item .txt{margin:4px 0 12px;font-size:15.5px}
  .ops{display:flex;gap:10px}
  .ops label{flex:1}
  /* Con cinco respuestas ("rara vez", "pocas veces"…) los botones en fila
     quedan ilegibles en un celular: se apilan y el texto se lee entero. */
  .ops.muchas{flex-direction:column;gap:7px}
  .ops.muchas span{text-align:left;padding:12px 14px;font-weight:500}
  .ops.muchas span::before{content:attr(data-n) ".  ";font-weight:700;opacity:.55}
  .ops.muchas input:checked + span::before{opacity:.85}
  .ops input{position:absolute;opacity:0;width:0;height:0}
  .ops span{display:block;text-align:center;padding:11px 8px;border:1.5px solid var(--linea);
            border-radius:9px;font-weight:600;font-size:15px;cursor:pointer;
            background:#fbfcfe;user-select:none}
  .ops input:checked + span{background:var(--acento);border-color:var(--acento);color:#fff}
  .ops input:focus-visible + span{outline:3px solid #b9d9c8;outline-offset:2px}

  .pie{position:fixed;left:0;right:0;bottom:0;background:var(--papel);
       border-top:1px solid var(--linea);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
  .pie .caja{padding:0;display:flex;gap:10px;align-items:center}
  button{font:inherit;font-weight:600;border-radius:9px;border:1.5px solid var(--linea);
         background:var(--papel);color:var(--tinta);padding:12px 16px;cursor:pointer}
  button.principal{background:var(--acento);border-color:var(--acento);color:#fff;flex:1}
  button:disabled{opacity:.45;cursor:not-allowed}
  .aviso{background:#fdf3ef;border:1px solid #e7c3b6;color:var(--alerta);
         border-radius:10px;padding:12px 14px;margin:12px 0;font-size:14.5px}
  .guardado{font-size:12px;color:var(--suave);text-align:center;margin-top:6px}
  .fin{text-align:center;padding:40px 20px}
  .fin .tic{font-size:46px}
  @media (max-width:420px){ .item .txt{font-size:15px} }
</style>
</head>
<body>

<header id="cabeceraPrueba" hidden>
  <div class="cabecera">
    <div class="marca">
      <img id="marcaLogo" src="" alt="" hidden>
      <span>
        <b id="tituloPrueba">Cargando…</b>
        <small id="subPrueba"></small>
      </span>
    </div>
    <div class="barra"><i id="barra"></i></div>
    <div class="cuenta">
      <span id="contador"></span>
      <span id="paginaTxt"></span>
    </div>
  </div>
</header>

<div class="caja" id="contenido"></div>

<div class="pie" id="pie" hidden>
  <div class="caja">
    <button id="btnAtras" type="button">Atrás</button>
    <button id="btnSiguiente" class="principal" type="button">Siguiente</button>
  </div>
  <div class="guardado" id="guardado">Tus respuestas se guardan solas</div>
</div>

<script>
const POR_PAGINA = 10;
const token = new URLSearchParams(location.search).get('t') || '';
let datos = null, respuestas = {}, pagina = 0, inicio = Date.now();
let pendienteGuardar = false, guardando = false;
// La portada: de quién es el enlace, el logo del centro y su mensaje.
// Llega antes que las preguntas y se guarda para las pantallas de cierre.
let marca = null, portada = null;

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

async function api(accion, cuerpo){
  const r = await fetch(`../api/prueba.php?accion=${accion}&t=${encodeURIComponent(token)}`, {
    method: cuerpo ? 'POST' : 'GET',
    headers: cuerpo ? {'Content-Type':'application/json'} : {},
    body: cuerpo ? JSON.stringify(cuerpo) : undefined
  });
  let j = null;
  try { j = await r.json(); } catch(e){ /* respuesta no JSON */ }
  if(!j) throw new Error('No hay conexión con el centro. Revisa tu internet.');
  return j;
}

function pantallaSimple(titulo, texto, icono, frase){
  $('cabeceraPrueba').hidden = true;
  $('contenido').innerHTML =
    `<div class="fin">
       ${marca && marca.logo ? `<img class="sello" src="${esc(marca.logo)}" alt="">` : ''}
       <div class="tic">${icono}</div>
       <h2>${esc(titulo)}</h2><p style="color:#5b6577">${esc(texto)}</p>
       ${marca && marca.centro ? `<p class="de" style="font-size:13px;color:#5b6577">${esc(marca.centro)}</p>` : ''}
       ${frase ? `<p class="frase">${esc(frase)}</p>` : ''}
     </div>`;
  $('pie').hidden = true;
  $('barra').style.width = '100%';
  $('contador').textContent = '';
  $('paginaTxt').textContent = '';
}

/* --- Paso 1: la portada -------------------------------------------
   Antes esta pantalla no existía: se abría el enlace y salían las
   preguntas. Un enlace reenviado al grupo de la familia lo contestaba
   quien lo abriera, y esas respuestas entraban a la historia clínica de
   otra persona sin que nada lo delatara. Acá se dice de quién es, antes
   de mostrar una sola frase del cuestionario. */
async function arrancar(){
  if(!token){ pantallaSimple('Enlace incompleto',
      'Abre el enlace completo que te envió el centro.', '🔗'); return; }
  let j;
  try { j = await api('abrir'); }
  catch(e){ pantallaSimple('Sin conexión', e.message, '📡'); return; }

  // El logo vive en la raíz del sitio y esta página está una carpeta
  // adentro, así que la dirección se completa acá.
  marca = j.marca || null;
  if(marca && marca.logo) marca.logo = '../' + marca.logo;

  if(j.cerrada){ pantallaSimple('Ya enviaste esta prueba', j.error, '✅'); return; }
  if(!j.ok){ pantallaSimple('No se puede abrir', j.error || 'Enlace no válido.', '⚠️'); return; }

  portada = j;
  document.title = marca && marca.centro ? marca.centro : 'Cuestionario';
  dibujarPortada();
}

function dibujarPortada(){
  const p = portada, m = marca || {};
  const pr = p.prueba || {};
  const cuanto = pr.minutos ? `unos ${pr.minutos} minutos` : 'un rato';

  $('cabeceraPrueba').hidden = true;
  $('pie').hidden = true;
  $('contenido').innerHTML = `
    <div class="portada">
      ${m.logo ? `<img class="sello" src="${esc(m.logo)}" alt="">` : ''}
      <h1>${esc(m.centro || 'Centro Psicológico')}</h1>
      ${m.lema ? `<p class="de">${esc(m.lema)}</p>` : ''}
    </div>
    <div class="tarjeta">
      <div class="paraquien">
        <div class="et">Este cuestionario es para</div>
        <div class="quien">${esc(p.paciente || '—')}</div>
        <div class="que">${esc(pr.nombre || 'Cuestionario')}${
          pr.nItems ? ` · ${pr.nItems} frases · ${esc(cuanto)}` : ''}</div>
      </div>
      <p>${esc(m.mensaje || '')}</p>
      ${p.empezada ? `<p><b>Ya lo habías empezado.</b> Al continuar retomas donde te
         quedaste; no se pierde nada de lo que ya contestaste.</p>` : ''}
      ${p.pideDocumento
        ? `<div class="campo">
             <label for="doc">Para continuar, escribe el número de DNI de ${esc(p.paciente || 'la persona')}</label>
             <input id="doc" inputmode="numeric" autocomplete="off" maxlength="12"
                    placeholder="········">
             <p class="pista">Lo pedimos para asegurarnos de que las respuestas entren
                a la historia clínica correcta. Si el enlace no es para ti, no lo contestes.</p>
           </div>`
        : `<p class="pista" style="font-size:13px;color:#5b6577">Si esta persona no eres
             tú ni alguien a tu cargo, cierra esta página y avísale al centro: las
             respuestas entran a su historia clínica.</p>`}
      <div id="avisoPortada"></div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:2px">
      <button type="button" class="principal" style="width:100%;max-width:420px"
              id="btnEntrar">${p.pideDocumento ? 'Continuar' : 'Sí, es para mí · Empezar'}</button>
      <button type="button" class="noyo" id="btnNoSoy">No es para mí</button>
    </div>
    ${m.frase ? `<p class="frase" style="text-align:center">${esc(m.frase)}</p>` : ''}`;

  $('btnEntrar').addEventListener('click', entrar);
  $('btnNoSoy').addEventListener('click', () => pantallaSimple('No lo contestes',
    'Avísale al centro que te llegó este enlace por error, para que lo anulen y '
    + 'se lo manden a quien corresponde. Gracias por decirlo.', '🙏'));
  const d = $('doc');
  if(d){
    d.addEventListener('keydown', e => { if(e.key === 'Enter') entrar(); });
    d.focus();
  }
  window.scrollTo({top:0});
}

/* --- Paso 2: recién acá llegan las preguntas ---------------------- */
async function entrar(){
  const btn = $('btnEntrar'), d = $('doc');
  const cuerpo = d ? {documento: d.value.trim()} : {confirmo: true};
  btn.disabled = true; btn.textContent = 'Un momento…';
  let j;
  try { j = await api('entrar', cuerpo); }
  catch(e){
    btn.disabled = false; btn.textContent = 'Continuar';
    $('avisoPortada').innerHTML = `<div class="aviso">${esc(e.message)}</div>`;
    return;
  }
  if(!j.ok){
    btn.disabled = false;
    btn.textContent = portada.pideDocumento ? 'Continuar' : 'Sí, es para mí · Empezar';
    $('avisoPortada').innerHTML = `<div class="aviso">${esc(j.error || 'No se pudo continuar.')}</div>`;
    if(d){ d.select(); d.focus(); }
    return;
  }

  datos = j;
  respuestas = j.respuestas || {};
  $('cabeceraPrueba').hidden = false;
  if(marca && marca.logo){ $('marcaLogo').src = marca.logo; $('marcaLogo').hidden = false; }
  $('tituloPrueba').textContent = j.prueba.siglas || j.prueba.nombre;
  $('subPrueba').textContent = j.paciente || '';
  document.title = j.prueba.siglas || 'Cuestionario';
  $('pie').hidden = false;
  // Si ya venía a medias, retoma donde se quedó.
  const primeraSin = primeraSinResponder();
  pagina = primeraSin ? Math.floor((primeraSin - 1) / POR_PAGINA) : 0;
  dibujar();
}

function primeraSinResponder(){
  for(const it of datos.prueba.items) if(!respuestas[it.n]) return it.n;
  return 0;
}
function totalRespondidas(){
  return datos.prueba.items.filter(it => respuestas[it.n]).length;
}
function nPaginas(){ return Math.ceil(datos.prueba.items.length / POR_PAGINA); }

function dibujar(){
  const items = datos.prueba.items;
  const ops = datos.prueba.opciones;
  const desde = pagina * POR_PAGINA;
  const bloque = items.slice(desde, desde + POR_PAGINA);

  let html = '';
  if(pagina === 0){
    // Las instrucciones cambian según cómo se responda: no es lo mismo
    // Verdadero/Falso que elegir entre cinco grados.
    const escala = ops.length > 3;
    html += `<div class="tarjeta">
      <h2>Antes de empezar</h2>
      <p>Vas a leer ${items.length} frases.${escala
        ? ` Para cada una, elige en qué medida describe cómo eres o cómo te
            sientes, desde <b>${esc(ops[0].etiqueta)}</b> hasta
            <b>${esc(ops[ops.length-1].etiqueta)}</b>.`
        : ` Marca <b>${esc(ops[0].etiqueta)}</b> si la frase describe cómo eres o
            cómo te sientes, y <b>${esc(ops[1].etiqueta)}</b> si no.`}</p>
      <p>No hay respuestas buenas ni malas. Contesta lo primero que pienses,
         sin darle muchas vueltas.${escala ? '' : ` Si una frase te cuesta decidir,
         marca <b>${esc(ops[1].etiqueta)}</b>.`}</p>
      <p>Tus respuestas se guardan solas: puedes cerrar y seguir después desde
         el mismo enlace. Solo las verá tu psicólogo.</p>
    </div>`;
  }
  html += bloque.map(it => {
    const marcada = respuestas[it.n];
    return `<div class="item" id="item${it.n}" data-n="${it.n}">
      <div class="n">${it.n} de ${items.length}</div>
      <div class="txt">${esc(it.texto)}</div>
      <div class="ops${ops.length > 3 ? ' muchas' : ''}">${ops.map(o => `
        <label><input type="radio" name="i${it.n}" value="${o.valor}"
               ${marcada === o.valor ? 'checked' : ''}><span data-n="${esc(o.valor)}">${esc(o.etiqueta)}</span></label>`).join('')}
      </div>
    </div>`;
  }).join('');

  const ultima = pagina >= nPaginas() - 1;
  if(ultima){
    const faltan = items.length - totalRespondidas();
    html += faltan > 0
      ? `<div class="aviso" id="avisoFaltan">Te faltan <b>${faltan}</b> frase(s) por
           contestar. No se puede enviar a medias: con frases en blanco el resultado
           sale más bajo de lo real y tu psicólogo no lo podría usar.
           <div style="margin-top:10px">
             <button type="button" onclick="irAFaltante()">Ir a la primera que falta</button>
           </div></div>`
      : `<div class="tarjeta"><h2>Listo</h2>
           <p>Contestaste las ${items.length} frases. Revisa si quieres cambiar
              alguna y luego toca <b>Enviar</b>.</p></div>`;
  }

  $('contenido').innerHTML = html;
  $('contenido').querySelectorAll('input[type=radio]').forEach(r => {
    r.addEventListener('change', e => {
      const n = Number(e.target.closest('.item').dataset.n);
      respuestas[n] = e.target.value;
      e.target.closest('.item').classList.remove('falta');
      actualizar();
      programarGuardado();
    });
  });

  $('btnAtras').disabled = pagina === 0;
  $('btnSiguiente').textContent = ultima ? 'Enviar respuestas' : 'Siguiente';
  actualizar();
  window.scrollTo({top:0});
}

function actualizar(){
  const total = datos.prueba.items.length, hechas = totalRespondidas();
  $('barra').style.width = (hechas / total * 100) + '%';
  $('contador').textContent = `${hechas} de ${total} contestadas`;
  $('paginaTxt').textContent = `Página ${pagina + 1} de ${nPaginas()}`;
  const ultima = pagina >= nPaginas() - 1;
  // El candado: en la última página el botón solo se activa si está completa.
  $('btnSiguiente').disabled = ultima && hechas < total;
  const av = $('avisoFaltan');
  if(av) av.innerHTML = av.innerHTML.replace(/<b>\d+<\/b>/, `<b>${total - hechas}</b>`);
}

function irAFaltante(){
  const n = primeraSinResponder();
  if(!n) return;
  const p = Math.floor((n - 1) / POR_PAGINA);
  if(p !== pagina){ pagina = p; dibujar(); }
  const el = $('item' + n);
  if(el){ el.classList.add('falta'); el.scrollIntoView({block:'center', behavior:'smooth'}); }
}

/* Guardado automático: se junta lo que va marcando y se manda cada pocos
   segundos, para no disparar una petición por cada toque. */
let temporizador = null;
function programarGuardado(){
  pendienteGuardar = true;
  clearTimeout(temporizador);
  temporizador = setTimeout(guardar, 2500);
}
async function guardar(){
  if(!pendienteGuardar || guardando) return;
  guardando = true; pendienteGuardar = false;
  try{
    await api('avance', {respuestas});
    $('guardado').textContent = 'Guardado ✓';
  }catch(e){
    pendienteGuardar = true;
    $('guardado').textContent = 'Sin conexión — lo intento de nuevo';
  }finally{ guardando = false; }
}

$('btnAtras').addEventListener('click', () => {
  if(pagina > 0){ pagina--; dibujar(); }
});
$('btnSiguiente').addEventListener('click', async () => {
  if(pagina < nPaginas() - 1){
    await guardar();
    pagina++; dibujar();
    return;
  }
  const btn = $('btnSiguiente');
  btn.disabled = true; btn.textContent = 'Enviando…';
  try{
    const j = await api('terminar', {respuestas, segundos: Math.round((Date.now() - inicio) / 1000)});
    if(j.ok){
      pantallaSimple('¡Gracias!',
        'Tus respuestas llegaron al centro. Tu psicólogo las revisará y '
        + 'conversarán los resultados en la consulta.', '✅', j.frase);
      return;
    }
    alert(j.error || 'No se pudo enviar.');
  }catch(e){
    alert(e.message);
  }
  btn.disabled = false; btn.textContent = 'Enviar respuestas';
  actualizar();
});

// Si cierra la pestaña con algo sin mandar, se intenta guardar igual.
window.addEventListener('visibilitychange', () => { if(document.hidden) guardar(); });

arrancar();
</script>
</body>
</html>
